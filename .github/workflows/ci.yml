name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run test suite
        run: node --test tests/*.mjs

      - name: Check first-party JavaScript syntax
        shell: bash
        run: |
          for file in ./*.js member/*.js worker/*.js worker/*/*.js; do
            node --check "$file"
          done

      - name: Enable pnpm
        run: corepack enable

      - name: Install browser test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E suite
        run: pnpm test:e2e
