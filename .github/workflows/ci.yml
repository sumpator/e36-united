name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run test suite
        run: node --test tests/*.mjs

      - name: Check first-party JavaScript syntax
        shell: bash
        run: |
          for file in ./*.js $(find admin member worker -name '*.js' -type f); do
            node --check "$file"
          done

      - name: Enable pnpm
        run: corepack enable

      - name: Install browser test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install required browser runtimes
        id: browser_setup
        run: pnpm exec playwright install --with-deps chromium webkit firefox

      - name: Diagnose history in a fresh Linux WebKit process
        id: history_preflight
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' && github.ref == 'refs/heads/fix/member-journeys-20261028' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/history-preflight-${{ github.run_attempt }}
        run: pnpm test:e2e tests/e2e/history-reading.spec.mjs --project=webkit --output=test-results/history-preflight-${{ github.run_attempt }}

      - name: Preserve fresh Linux history diagnostics
        if: ${{ failure() && steps.history_preflight.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-history-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/history-preflight-${{ github.run_attempt }}/
            playwright-report/history-preflight-${{ github.run_attempt }}/
          retention-days: 5
          if-no-files-found: warn

      - name: Run browser E2E suite
        id: chromium
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/chromium-${{ github.run_attempt }}
        run: pnpm test:e2e --project=chromium --output=test-results/chromium-${{ github.run_attempt }}

      - name: Preserve Chromium failure diagnostics
        if: ${{ failure() && steps.chromium.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-chromium-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/chromium-${{ github.run_attempt }}/
            playwright-report/chromium-${{ github.run_attempt }}/
          retention-days: 5
          if-no-files-found: warn

      - name: Run focused WebKit reliability suite
        id: webkit
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/webkit-${{ github.run_attempt }}
        run: pnpm test:e2e --project=webkit --output=test-results/webkit-${{ github.run_attempt }}

      - name: Preserve WebKit failure diagnostics
        if: ${{ failure() && steps.webkit.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-webkit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/webkit-${{ github.run_attempt }}/
            playwright-report/webkit-${{ github.run_attempt }}/
          retention-days: 5
          if-no-files-found: warn

      - name: Run focused Firefox journey suite
        id: firefox
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/firefox-${{ github.run_attempt }}
        run: pnpm test:e2e --project=firefox --output=test-results/firefox-${{ github.run_attempt }}

      - name: Preserve Firefox failure diagnostics
        if: ${{ failure() && steps.firefox.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-firefox-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/firefox-${{ github.run_attempt }}/
            playwright-report/firefox-${{ github.run_attempt }}/
          retention-days: 5
          if-no-files-found: warn
